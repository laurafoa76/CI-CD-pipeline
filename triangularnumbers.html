    </div>
        <h2>Please enter a number between 1 and and 22 </h2>
        <input id="numInput" type="number" placeholder="Enter a number">
<button onclick="checkTriangular()">Check</button>
<p id="result"></p>

<script>
function isTriangular(n) {
  return Math.sqrt(8 * n + 1) % 1 === 0;
}

function checkTriangular() {
  const num = parseInt(document.getElementById('numInput').value);
  const result = isTriangular(num) ? `${num} is Triangular` : `${num} is Not Triangular`;
  document.getElementById('result').textContent = result;
}
</script>
    
     <h2> Check your answer bellow:</h2> 
     <img src="images/triangularnumbers.gif" alt="An image of even numbers" width="900px">
