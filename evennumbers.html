
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

</head>
<body>
    <h1> Even Numbers </h1>
    
     <div class="navbar">
        <li><a href="/index.html">HOMEPAGE</a></li>
        <li><a href="/oddnumbers.html">ODD NUMBERS</a></li>
        <li><a href="/squarenumbers.html">SQUARE NUMBERS</a></li>
        <div><a href="/specialnumbers.html">PRIME NUMBERS</a></div>
        <div><a href="cubenumbers.html">CUBE NUMBERS</a></div>
        <div><a href="/triangularnumbers.html">TRIANGULAR NUMBERS</a></div>
        
     </div>
     <h1>Please enter a number or select the arrows in the box</h1>
     <input id="numInput" type="number">
     <button onclick="checkNum()">Check</button>
     <p id="result"></p> 

     <script>
     function checkNum() {
     const num = parseInt(document.getElementById('numInput').value);
     const result = num % 2 === 0 ? "Even" : "Odd";
     document.getElementById('result').textContent = `The number is ${result}`;
   }
     </script>
     <h1> Check your answer bellow</h1>
     <img src="images/evennumbers.jpg" alt="An image of even numbers">
</body>
