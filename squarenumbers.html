<body>
    <h2> Square Numbers </h2>
     <div class="navbar">
        <li><a href="/index.html">HOMEPAGE</a></li>
        <li><a href="/evennumbers.html">EVEN NUMBERS</a></li>
        <li><a href="/oddnumbers.html">ODD NUMBERS</a></li>

        <div><a href="cubenumbers.html">CUBE NUMBERS</a></div>
        <div><a href="/triangularnumbers.html">TRIANGULAR NUMBERS</a></div>
        
     </div>
     <h2> Please enter a number between 1 and 100  </h2>
        <input id="numInput" type="number" placeholder="Enter a number">
        <button onclick="checkSquare()">Check</button>
        <p id="result"></p>
     <script>
     function isSquare(n) {
     return Math.sqrt(n) % 1 === 0;
   }

     function checkSquare() {
     const num = parseInt(document.getElementById('numInput').value);
     const result = isSquare(num) ? `${num} is a Square Number` : `${num} is Not a Square Number`;
     document.getElementById('result').textContent = result;
     }
     </script>

    <h2>Check your answer below:</h2> 
    <img src="images/sqaurenumbers.jpg" alt="An image of square numbers" width="500">
</body>
