<body>
    <h1> Cube Numbers </h1>
    
     <div class="navbar">
        <div><a href="/index.html">HOMEPAGE</a></div>

    </div>
     <h2> Please enter a number between 1 and 10</h2>
     <input id="numInput" type="number">
     <button onclick="calCube()">cube</button>
     <p id="result"></p>

     <script>
     function calCube() {
     const num = parseFloat(document.getElementById('numInput').value);
     const cube = num ** 3;
     document.getElementById('result').textContent = `Cube of ${num} = ${cube}`;
  }
     </script>
     <h2>Check your answer bellow:</h2>
    <img src="images/cube numbers.jpg" alt="An image of cube numbers">

</body>
